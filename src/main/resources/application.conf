kafka {
  groupId = "helsemelding.outbound-processing-service"
  bootstrapServers = "${KAFKA_BROKERS:-http://localhost:9092}"
  securityProtocol = "SSL"
  keystoreType = "PKCS12"
  keystoreLocation = "${KAFKA_KEYSTORE_PATH:-}"
  keystorePassword = "${KAFKA_CREDSTORE_PASSWORD:-}"
  truststoreType = "JKS"
  truststoreLocation = "${KAFKA_TRUSTSTORE_PATH:-}"
  truststorePassword = "${KAFKA_CREDSTORE_PASSWORD:-}"
  topics {
    dialogMessageOutJson = "helsemelding.dialog.out.json"
    dialogMessageOutXml = "helsemelding.dialog.out.xml"
    errorMessage = "helsemelding.dialog.out.error"
  }
}

pdl {
  graphqlUrl = "${PDL_GRAPHQL_URL:-http://localhost:8081/graphql}"
}

providerRegistry {
  baseUrl = "${PROVIDER_REGISTRY_BASE_URL:-http://localhost:8082}"
}

server {
  port = 8080
  // time before shutdown is initiated
  preWait = "5s"
}
